# uncrustify —— clang-format 的替代方案（配置项更细，可完全自定义）
# 用法：uncrustify -c ~/.config/dev-toolbox/uncrustify.cfg --no-backup -l C main.c
# 生成完整默认配置：uncrustify --update-config-with-doc -c uncrustify.cfg
indent_columns = 4
indent_with_tabs = 0
input_tab_size = 4
output_tab_size = 4
code_width = 100
nl_end_of_file = add
nl_end_of_file_min = 1
