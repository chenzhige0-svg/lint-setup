# 四层关卡中的「Git 钩子」层：提交只跑快检，推送再跑重型分析。
# 安装：pre-commit install --install-hooks   # 同时安装 pre-commit 和 pre-push
# 手动：pre-commit run / pre-commit run --all-files
#       pre-commit run --all-files --hook-stage pre-push
#
# 工具全部使用本机已安装版本（language: system），保证编辑器、OpenCode、
# 钩子、CI 调用同一套二进制；规则只来自项目根目录的配置文件。
minimum_pre_commit_version: "3.7.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: false

exclude: |
  (?x)^(
    (build|install|log|dist|node_modules|\.venv|venv)/.*|
    .*\.(min\.js|min\.css|map)$
  )

repos:
  # ---------- 0. 通用卫生：毫秒级，最先跑 ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: debug-statements
      - id: detect-private-key

  # ---------- 1. 所有语言工具：本机系统二进制 ----------
  - repo: local
    hooks:
      # --- 密钥：扫描工作区，CI 还会做全历史扫描 ---
      - id: gitleaks
        name: gitleaks · 密钥扫描
        entry: gitleaks dir . --redact --no-banner
        language: system
        pass_filenames: false

      # --- Python：Ruff 先修 lint，再单独跑 format ---
      - id: ruff-check
        name: ruff · lint
        entry: ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff · format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: bandit
        name: bandit · 安全
        entry: bandit -q -c pyproject.toml
        language: system
        types_or: [python, pyi]
        files: ^(src|app|scripts|tools)/

      # --- Shell ---
      - id: shellcheck
        name: shellcheck
        entry: shellcheck --external-sources --severity=warning
        language: system
        types: [shell]

      - id: shfmt
        name: shfmt
        entry: shfmt -i 2 -ci -sr -w
        language: system
        types: [shell]

      # --- JS / TS / CSS / Markdown / 配置 ---
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown --no-error-on-unmatched-pattern
        language: system
        types_or: [javascript, jsx, ts, tsx, css, scss, json, yaml, markdown, html]

      - id: eslint
        name: eslint
        entry: eslint --fix --no-warn-ignored
        language: system
        types_or: [javascript, jsx, ts, tsx]

      - id: stylelint
        name: stylelint
        entry: stylelint --fix --allow-empty-input
        language: system
        types_or: [css, scss]

      - id: markdownlint
        name: markdownlint
        entry: markdownlint-cli2
        language: system
        types: [markdown]

      - id: yamllint
        name: yamllint
        entry: yamllint --strict
        language: system
        types: [yaml]

      - id: hadolint
        name: hadolint
        entry: hadolint
        language: system
        types: [dockerfile]

      # --- C / C++ 格式化 ---
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        types_or: [c, c++]

      # --- Go / Rust 格式化 ---
      - id: gofmt
        name: gofmt
        entry: gofmt -w -s
        language: system
        types: [go]

      - id: rustfmt
        name: rustfmt
        entry: rustfmt
        language: system
        types: [rust]

      # ---------- 2. 重型检查：pre-push / CI ----------
      - id: pyright
        name: pyright · 类型检查
        entry: pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-push]

      - id: tsc
        name: tsc · 类型检查
        entry: tsc --noEmit
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
        stages: [pre-push]

      - id: cppcheck
        name: cppcheck
        entry: cppcheck --enable=warning,performance,portability --inline-suppr --error-exitcode=1 --quiet
        language: system
        types_or: [c, c++]
        stages: [pre-push]

      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy -p build --quiet
        language: system
        types_or: [c, c++]
        stages: [pre-push]

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

      - id: clippy
        name: clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      # 遗留项目改用 mypy 时取消注释，并移除 pyright hook
      # - id: mypy
      #   name: mypy
      #   entry: mypy
      #   language: system
      #   types_or: [python, pyi]
      #   pass_filenames: false
      #   stages: [pre-push]
