# yamllint —— YAML
# 用法：yamllint -c ~/.config/dev-toolbox/.yamllint.yaml --strict .
extends: default

rules:
  line-length:
    max: 120
  indentation:
    spaces: 2
    indent-sequences: true
  truthy:
    allowed-values: ["true", "false", "on", "off"]
    level: warning
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  empty-lines:
    max: 2

ignore: |
  node_modules/
  .venv/
  venv/
  dist/
  build/
  install/
  log/
  .git/
